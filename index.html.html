        (function() {
            emailjs.init("YOUR_EMAILJS_PUBLIC_KEY");

            const [pathType, setPathType] = useState(null);

            useEffect(() => {
                const savedData = localStorage.getItem('careerAssessmentHE');
                if (savedData) {
                    const { pathType: savedPath, currentQuestion: savedQ, answers: savedAnswers } = JSON.parse(savedData);
                    if (savedPath && Object.keys(savedAnswers).length > 0) {
                        const resume = window.confirm('יש לך הערכה שמורה. האם תרצה להמשיך?');
                        if (resume) {
                            setPathType(savedPath);
                            setCurrentQuestion(savedQ);
                            setAnswers(savedAnswers);
                            setStarted(true);
                        } else {
                            localStorage.removeItem('careerAssessmentHE');
                        }
                    }
                }
            }, []);

            useEffect(() => {
                if (started && !showResults && Object.keys(answers).length > 0) {
                    localStorage.setItem('careerAssessmentHE', JSON.stringify({

                    },

                    {

                        ]
                    },
                    {

                        question: "איך אתה מעדיף להתחיל את יום העבודה?",

                            { text: "על ידי התייעצות עם הצוות", traits: { social: 2, collaboration: 1 } },
                            { text: "עם חופש יצירתי לחקור", traits: { creative: 2, independence: 1 } }
                        ]
                    },
                    {
                        id: 20,
                        question: "מה הגישה שלך ללקיחת סיכונים?",
                        options: [
                            { text: "אני מנתח בקפידה לפני סיכונים", traits: { analytical: 2, planning: 1 } },
                            { text: "אני נוח עם אי-ודאות והתנסות", traits: { innovation: 2, adaptability: 1 } },
                            { text: "אני מעדיף שיטות מוכחות", traits: { stability: 2, traditional: 1 } }
                        ]
                    }
                ]
            };

            const getQuestions = () => {
                if (pathType === 'quick') return questionBank.quick;
                if (pathType === 'medium') return [...questionBank.quick, ...questionBank.medium];
                if (pathType === 'full') return [...questionBank.quick, ...questionBank.medium, ...questionBank.full];
                return [];
            };

            const questions = getQuestions();
            const totalQuestions = questions.length;
            const progress = ((currentQuestion) / totalQuestions) * 100;

            const calculateRecommendations = () => {
                const traitScores = {};
                
                Object.values(answers).forEach(answer => {
                    Object.entries(answer.traits).forEach(([trait, score]) => {
                        traitScores[trait] = (traitScores[trait] || 0) + score;
                    });
                });

                const careerProfiles = [
                    {
                        title: "מהנדס תוכנה / מפתח",
                        description: "בניית ותחזוקת אפליקציות תוכנה, פתרון בעיות טכניות מורכבות ועבודה עם טכנולוגיות חדשניות.",
                        traits: { technical: 6, analytical: 6, learning: 4 },
                        salary: "$90,000 - $180,000",
                        growth: "מעולה"
                    },
                    {
                        title: "מדען נתונים / אנליסט",

                    },

                        growth: "מעולה"
                    },
                    {

                    },
                    {

                        growth: "טוב מאוד"
                    },
                    {
                        title: "איש מקצוע בתחום הבריאות",
                        description: "מתן טיפול ישיר למטופלים ושיפור תוצאות בריאות.",
                        traits: { helping: 8, empathy: 7, resilience: 6 },
                        salary: "$65,000 - $220,000",
                        growth: "מעולה"
                    },
                    {
                        title: "מורה / חינוך",
                        description: "עוררת השראה וחינוך תלמידים.",
                        traits: { helping: 7, communication: 7, social: 6 },

                    },
                    {

                    },
                    {
                        title: "מנהל משאבי אנוש",

                        growth: "טוב"
                    },
                    {
                        title: "מעצב גרפי",

                        traits: { creative: 9, artistic: 7, innovation: 5 },
                        salary: "$50,000 - $120,000",
                        growth: "טוב"
                    },
                    {
                        title: "חוקר מדעי",

                        traits: { analytical: 8, learning: 8, precision: 7 },
                        salary: "$75,000 - $140,000",
                        growth: "טוב"
                    },
                    {
                        title: "מנהל מכירות",
                        description: "בניית קשרי לקוחות וסגירת עסקאות.",
                        traits: { social: 8, communication: 7, resilience: 6 },
                        salary: "$60,000 - $150,000+",
                        growth: "טוב מאוד"
                    },
                    {
                        title: "מנהל פרויקטים",
                        description: "תכנון וביצוע פרויקטים תוך תיאום צוותים.",
                        traits: { planning: 7, leadership: 6, communication: 6 },
                        salary: "$75,000 - $135,000",
                        growth: "טוב מאוד"
                    },
                    {
                        title: "יזם / בעל עסק",
                        description: "בניית עסק משלך ויצירת ערך בשוק.",
                        traits: { innovation: 8, independence: 7, resilience: 7 },
                        salary: "משתנה מאוד",
                        growth: "תלוי בך"
                    }
                ];

                careerProfiles.forEach(career => {
                    let matchScore = 0;
                    let maxPossibleScore = 0;
                    
                    Object.entries(career.traits).forEach(([trait, requiredScore]) => {
                        const userScore = traitScores[trait] || 0;
                        matchScore += Math.min(userScore, requiredScore);
                        maxPossibleScore += requiredScore;
                    });
                    
                    career.match = Math.round((matchScore / maxPossibleScore) * 100);
                });

                return careerProfiles.sort((a, b) => b.match - a.match).slice(0, 5);
            };

            const sendEmail = async () => {
                if (!userEmail) {
                    alert('אנא הזן כתובת אימייל');
                    return;
                }

                const recommendations = calculateRecommendations();
                
                const resultsHTML = recommendations.map((career, index) => 
                    `${index + 1}. ${career.title} - ${career.match}% התאמה
                    ${career.description}
                    שכר: ${career.salary} | צמיחה: ${career.growth}
                    `
                ).join('\n\n');

                const templateParams = {
                    to_email: userEmail,
                    user_email: userEmail,
                    bcc_email: 'orip@mail.afeka.ac.il',
                    assessment_type: pathType === 'quick' ? 'מהיר' : pathType === 'medium' ? 'בינוני' : 'מלא',
                    results: resultsHTML
                };

                try {
                    await emailjs.send('YOUR_SERVICE_ID', 'YOUR_TEMPLATE_ID', templateParams);
                    setEmailSent(true);
                    alert('התוצאות נשלחו לאימייל בהצלחה!');
                } catch (error) {
                    console.error('שגיאה בשליחת אימייל:', error);
                    alert('שליחת האימייל נכשלה. אנא נסה שוב או צלם מסך של התוצאות.');
                }
            };

            const handleAnswer = (option) => {
                setAnswers({
                    ...answers,
                    [questions[currentQuestion].id]: option
                });

                if (currentQuestion < totalQuestions - 1) {
                    setCurrentQuestion(currentQuestion + 1);
                } else {
                    setShowResults(true);
                    localStorage.removeItem('careerAssessmentHE');
                }
            };

            const handleRestart = () => {
                setStarted(false);
                setPathType(null);
                setCurrentQuestion(0);
                setAnswers({});
                setShowResults(false);
                setUserEmail('');
                setShowEmailInput(false);
                setEmailSent(false);
                localStorage.removeItem('careerAssessmentHE');
            };

            const handleExit = () => {
                const confirmExit = window.confirm('האם אתה בטוח שברצונך לצאת? ההתקדמות שלך נשמרה ותוכל לחזור מאוחר יותר.');
                if (confirmExit) {
                    setStarted(false);
                    setPathType(null);
                    setCurrentQuestion(0);
                    setAnswers({});
                }
            };

            const handleSaveForLater = () => {
                setShowSaveModal(true);
                setTimeout(() => {
                    setShowSaveModal(false);
                    setStarted(false);
                }, 2000);
            };

            const startAssessment = (type) => {
                setPathType(type);
                setStarted(true);
            };

            if (!started) {
                return (
                    <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 p-8">
                        <div className="max-w-4xl mx-auto">
                            <div className="text-center mb-12">
                                <div className="flex justify-center mb-4">
                                    <svg className="w-16 h-16 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                                    </svg>
                                </div>
                                <h1 className="text-4xl font-bold text-gray-900 mb-4">סוכן הדרכה לקריירה</h1>
                                <p className="text-xl text-gray-600">
                                    גלה את מסלול הקריירה האידיאלי שלך באמצעות הערכה מותאמת אישית
                                </p>
                            </div>

                            <div className="grid md:grid-cols-3 gap-6">
                                <div className="bg-white rounded-xl shadow-lg p-6 border-2 border-transparent hover:border-indigo-500 transition-all cursor-pointer"
                                     onClick={() => startAssessment('quick')}>
                                    <div className="flex items-center justify-center mb-4">
                                        <svg className="w-12 h-12 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                                        </svg>
                                    </div>
                                    <h3 className="text-2xl font-bold text-center mb-2">מסלול מהיר</h3>
                                    <p className="text-center text-gray-600 mb-4">10 שאלות</p>
                                    <p className="text-center text-sm text-gray-500 mb-4">
                                        הבנה בסיסית תוך 5 דקות
                                    </p>
                                    <div className="bg-green-50 rounded-lg p-3 text-center">
                                        <span className="text-green-700 font-semibold">~5 דקות</span>
                                    </div>
                                </div>

                                <div className="bg-white rounded-xl shadow-lg p-6 border-2 border-indigo-500 hover:border-indigo-600 transition-all cursor-pointer relative"
                                     onClick={() => startAssessment('medium')}>
                                    <div className="absolute top-0 left-0 bg-indigo-500 text-white px-3 py-1 rounded-br-lg rounded-tl-lg text-xs font-semibold">
                                        מומלץ
                                    </div>
                                    <div className="flex items-center justify-center mb-4">
                                        <svg className="w-12 h-12 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                                        </svg>
                                    </div>
                                    <h3 className="text-2xl font-bold text-center mb-2">מסלול בינוני</h3>
                                    <p className="text-center text-gray-600 mb-4">15 שאלות</p>
                                    <p className="text-center text-sm text-gray-500 mb-4">
                                        הערכה מאוזנת להמלצות מדויקות
                                    </p>
                                    <div className="bg-indigo-50 rounded-lg p-3 text-center">
                                        <span className="text-indigo-700 font-semibold">~8 דקות</span>
                                    </div>
                                </div>

                                <div className="bg-white rounded-xl shadow-lg p-6 border-2 border-transparent hover:border-indigo-500 transition-all cursor-pointer"
                                     onClick={() => startAssessment('full')}>
                                    <div className="flex items-center justify-center mb-4">
                                        <svg className="w-12 h-12 text-purple-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z" />
                                        </svg>
                                    </div>
                                    <h3 className="text-2xl font-bold text-center mb-2">מסלול מלא</h3>
                                    <p className="text-center text-gray-600 mb-4">20 שאלות</p>
                                    <p className="text-center text-sm text-gray-500 mb-4">
                                        צלילה מקיפה לתובנות מותאמות
                                    </p>
                                    <div className="bg-purple-50 rounded-lg p-3 text-center">
                                        <span className="text-purple-700 font-semibold">~12 דקות</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            if (showResults) {
                const recommendations = calculateRecommendations();
                
                return (
                    <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 p-8">
                        <div className="max-w-4xl mx-auto">
                            <div className="text-center mb-8">
                                <h1 className="text-4xl font-bold text-gray-900 mb-2">התאמות הקריירה שלך</h1>
                                <p className="text-lg text-gray-600">
                                    על סמך {totalQuestions} התשובות שלך - 5 התאמות הקריירה המובילות
                                </p>
                            </div>

                            <div className="space-y-6 mb-8">
                                {recommendations.map((career, index) => (
                                    <div key={index} className="bg-white rounded-xl shadow-lg p-6 border-2 border-indigo-100">
                                        <div className="flex items-start justify-between mb-4">
                                            <div className="flex-1">
                                                <div className="flex items-center mb-2">
                                                    <span className="text-2xl font-bold text-indigo-600 ml-3">#{index + 1}</span>
                                                    <h3 className="text-2xl font-bold text-gray-900">{career.title}</h3>
                                                </div>
                                                <p className="text-gray-600 mb-4">{career.description}</p>
                                            </div>
                                            <div className="mr-4 text-left">
                                                <div className="text-3xl font-bold text-indigo-600 mb-1">{career.match}%</div>
                                                <div className="text-sm text-gray-500">התאמה</div>
                                            </div>
                                        </div>
                                        
                                        <div className="mb-4">
                                            <div className="w-full bg-gray-200 rounded-full h-3">
                                                <div 
                                                    className="bg-gradient-to-r from-indigo-500 to-purple-500 h-3 rounded-full transition-all duration-1000"
                                                    style={{width: `${career.match}%`}}
                                                />
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-2 gap-4 text-sm">
                                            <div>
                                                <span className="text-gray-500">טווח שכר:</span>
                                                <span className="mr-2 font-semibold text-gray-700">{career.salary}</span>
                                            </div>
                                            <div>
                                                <span className="text-gray-500">תחזית צמיחה:</span>
                                                <span className="mr-2 font-semibold text-gray-700">{career.growth}</span>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>

                            {!showEmailInput ? (
                                <div className="text-center mb-8">
                                    <button
                                        onClick={() => setShowEmailInput(true)}
                                        className="inline-flex items-center px-8 py-3 bg-green-600 text-white rounded-lg font-semibold hover:bg-green-700 transition-colors ml-4"
                                    >
                                        📧 שלח תוצאות באימייל
                                    </button>
                                    <button
                                        onClick={handleRestart}
                                        className="inline-flex items-center px-8 py-3 bg-indigo-600 text-white rounded-lg font-semibold hover:bg-indigo-700 transition-colors"
                                    >
                                        🔄 בצע הערכה שוב
                                    </button>
                                </div>
                            ) : (
                                <div className="bg-white rounded-xl shadow-lg p-6 mb-8">
                                    <h3 className="text-lg font-semibold mb-4">שלח תוצאות באימייל</h3>
                                    <div className="flex gap-4">
                                        <input
                                            type="email"
                                            value={userEmail}
                                            onChange={(e) => setUserEmail(e.target.value)}
                                            placeholder="הזן כתובת אימייל"
                                            className="flex-1 px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-indigo-500 focus:outline-none"
                                        />
                                        <button
                                            onClick={sendEmail}
                                            disabled={emailSent}
                                            className={`px-6 py-2 rounded-lg font-semibold transition-colors ${
                                                emailSent 
                                                    ? 'bg-gray-400 cursor-not-allowed' 
                                                    : 'bg-indigo-600 hover:bg-indigo-700'
                                            } text-white`}
                                        >
                                            {emailSent ? 'נשלח!' : 'שלח'}
                                        </button>
                                    </div>
                                    {emailSent && (
                                        <p className="text-green-600 text-sm mt-2">✓ התוצאות נשלחו בהצלחה!</p>
                                    )}
                                </div>
                            )}

                            <div className="text-center text-gray-600">
                                <p className="mb-2">יש לך שאלות או זקוק להדרכה?</p>
                                <div className="space-y-1">
                                    <p>
                                        📧 אימייל: <a href="mailto:oriporat@yahoo.com" className="text-indigo-600 hover:underline font-semibold">oriporat@yahoo.com</a>
                                    </p>
                                    <p>
                                        💼 לינקדאין: <a href="https://www.linkedin.com/in/4nto" target="_blank" rel="noopener noreferrer" className="text-indigo-600 hover:underline font-semibold">linkedin.com/in/4nto</a>
                                    </p>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 p-8">
                    <div className="max-w-3xl mx-auto">
                        <div className="mb-8">
                            <div className="flex justify-between items-center mb-2">
                                <span className="text-sm font-semibold text-gray-600">
                                    שאלה {currentQuestion + 1} מתוך {totalQuestions}
                                </span>
                                <div className="flex gap-2">
                                    <button
                                        onClick={handleSaveForLater}
                                        className="px-4 py-2 bg-yellow-500 text-white rounded-lg font-semibold hover:bg-yellow-600 transition-colors text-sm"
                                    >
                                        💾 שמור וצא
                                    </button>
                                    <button
                                        onClick={handleExit}
                                        className="px-4 py-2 bg-red-500 text-white rounded-lg font-semibold hover:bg-red-600 transition-colors text-sm"
                                    >
                                        ✕ יציאה
                                    </button>
                                </div>
                            </div>
                            <div className="flex justify-between items-center mb-2">
                                <span className="text-sm font-semibold text-indigo-600">
                                    {Math.round(progress)}% הושלם
                                </span>
                            </div>
                            <div className="w-full bg-gray-200 rounded-full h-3">
                                <div 
                                    className="bg-gradient-to-r from-indigo-500 to-purple-500 h-3 rounded-full transition-all duration-300"
                                    style={{width: `${progress}%`}}
                                />
                            </div>
                        </div>

                        <div className="bg-white rounded-xl shadow-lg p-8 mb-6">
                            <h2 className="text-2xl font-bold text-gray-900 mb-8">
                                {questions[currentQuestion].question}
                            </h2>

                            <div className="space-y-4">
                                {questions[currentQuestion].options.map((option, index) => (
                                    <button
                                        key={index}
                                        onClick={() => handleAnswer(option)}
                                        className="w-full text-right p-4 rounded-lg border-2 border-gray-200 hover:border-indigo-500 hover:bg-indigo-50 transition-all group"
                                    >
                                        <div className="flex items-center">
                                            <div className="w-8 h-8 rounded-full border-2 border-gray-300 group-hover:border-indigo-500 flex items-center justify-center ml-4 flex-shrink-0">
                                                <span className="text-gray-600 group-hover:text-indigo-600 font-semibold">
                                                    {String.fromCharCode(1488 + index)}
                                                </span>
                                            </div>
                                            <span className="text-gray-700 group-hover:text-gray-900">
                                                {option.text}
                                            </span>
                                        </div>
                                    </button>
                                ))}
                            </div>
                        </div>
                    </div>

                    {showSaveModal && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
                            <div className="bg-white rounded-xl p-8 max-w-md shadow-2xl">
                                <div className="text-center">
                                    <svg className="w-16 h-16 text-green-500 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 13l4 4L19 7" />
                                    </svg>
                                    <h3 className="text-2xl font-bold text-gray-900 mb-2">ההתקדמות נשמרה!</h3>
                                    <p className="text-gray-600">תוכל לחזור להמשיך בכל עת.</p>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        ReactDOM.render(<CareerGuidanceAgentHebrew />, document.getElementById('root'));
    </script>
</body>
</html>
